name: Native UI state domains

on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  focus-domain:
    if: github.repository == 'shim9610/fairing'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bind real egui state and queries to the focus domain
        run: python3 verification/native_ui_state.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-ui-state-domains
          retention-days: 14
          path: |
            target/assurance/native-ui-state/*.json
            target/assurance/native-ui-state/*.log
            target/assurance/native-ui-state/focus-*.rs
