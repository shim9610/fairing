<text text-anchor="middle" x="393" y="-432.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">Fresh snapshot(now) for each admission</text>
<text text-anchor="middle" x="393" y="-414.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">Base and temporary grants evaluated independently</text>
