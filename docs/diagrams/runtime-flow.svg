<title id="diagram-title">Fairing host update flow</title><desc id="diagram-description">Logic-only updates and UI frames share state processing. Matching UI frames reuse prepared state; both paths can produce events without requiring continuous redraw.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 1093.6)">
