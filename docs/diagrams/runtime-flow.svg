<text text-anchor="middle" x="289.5" y="-905.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">logic_with(ctx, app_state)</text>
<text text-anchor="middle" x="289.5" y="-887.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">Monotonic wall-time update; no input consumption</text>
