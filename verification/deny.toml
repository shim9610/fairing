[graph]
all-features = true
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# NCSA is libFuzzer's permissive licence, confined to this unpublished tool workspace.
# The product workspace's licence policy remains in ../deny.toml.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "OFL-1.1", "Ubuntu-font-1.0", "NCSA"]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
