# The blocking/sync ban, enforced at compile time.
# Its counterpart lint is the root Cargo.toml's `[workspace.lints.clippy] disallowed_types = "deny"`,
# and `xtask sync-check` also scans configured identifiers and UI blocking-call spellings
# before compilation. The text scan does not resolve arbitrary call targets.
disallowed-types = [
  { path = "std::sync::Mutex", reason = "no blocking sync. Use channels and atomics" },
  { path = "std::sync::RwLock", reason = "the same" },
  { path = "std::sync::Condvar", reason = "the same" },
  { path = "std::sync::Barrier", reason = "the same" },
  { path = "std::sync::OnceLock", reason = "it blocks on an initialisation race. Use a const or an atomic" },
  { path = "std::sync::LazyLock", reason = "the same" },
  { path = "std::sync::Once", reason = "the same race, without the value attached" },
  { path = "std::sync::ReentrantLock", reason = "no blocking sync" },
  { path = "std::cell::LazyCell", reason = "single-threaded, but it panics where the initialiser re-enters. Use a const or OnceCell" },
  { path = "std::cell::UnsafeCell", reason = "interior mutation through UnsafeCell is outside the permitted UI-source policy" },
  { path = "std::sync::mpsc::SyncSender", reason = "only the private BoundedSender transport may own this; its blocking methods must not escape" },
  { path = "std::sync::mpsc::Receiver", reason = "direct Receiver access is excluded; use fairing::inbox::Inbox for non-waiting receive/drain operations" },
  { path = "std::sync::mpsc::Iter", reason = "iterating a Receiver blocks" },
  { path = "std::sync::mpsc::IntoIter", reason = "the same" },
]

# The type list above cannot reach a **function**, so the constructor is named here. `disallowed_methods`
# is denied in the root Cargo.toml alongside `disallowed_types`.
#
# Receiver and bounded-send method bans below apply to workspace members using these lints.
# Other configured thread-wait spellings are checked by the crate-scoped UI source scan.
# Application backend workers outside this workspace use their own lint policy.
disallowed-methods = [
  { path = "std::process::abort", reason = "product code returns errors instead of terminating the process" },
  { path = "std::process::exit", reason = "the application owns process lifetime" },
  { path = "std::panic::resume_unwind", reason = "callback failures must not be rethrown from product code" },
  { path = "std::panic::panic_any", reason = "product code returns errors rather than starting an unwind" },
  { path = "std::sync::mpsc::SyncSender::send", reason = "bounded sends must return Full instead of waiting; use BoundedSender::try_send" },
  { path = "std::sync::mpsc::SyncSender::send_timeout", reason = "the UI must not wait for queue capacity", allow-invalid = true },
  # These method bans use resolved types, including aliases and re-exports.
  # They do not identify implicit IntoIterator calls in `for msg in rx`.
  # `fairing::inbox::Inbox` keeps the Receiver private and exposes try_recv/drain.
  { path = "std::sync::mpsc::Receiver::recv", reason = "it blocks the UI thread. Use Inbox::try_recv / Inbox::drain" },
  { path = "std::sync::mpsc::Receiver::recv_timeout", reason = "the same, with a deadline" },
  { path = "std::sync::mpsc::Receiver::recv_deadline", reason = "the same, unstable", allow-invalid = true },
  { path = "std::sync::mpsc::Receiver::iter", reason = "it waits for the next message. Use Inbox::drain, which ends at the end of the queue" },
]

# Enabled on the two libraries only outside cfg(test). Clippy resolves macro aliases too.
disallowed-macros = [
  { path = "std::assert", reason = "return an error or handle the invalid state" },
  { path = "std::assert_eq", reason = "the same" },
  { path = "std::assert_ne", reason = "the same" },
  { path = "std::debug_assert", reason = "debug product builds must remain recoverable too" },
  { path = "std::debug_assert_eq", reason = "the same" },
  { path = "std::debug_assert_ne", reason = "the same" },
  { path = "std::panic", reason = "return an error or use a safe fallback" },
  { path = "std::unreachable", reason = "unexpected states need a recoverable branch" },
  { path = "std::todo", reason = "product code must handle this case" },
  { path = "std::unimplemented", reason = "the same" },
]
