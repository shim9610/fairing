<title id="diagram-title">Fairing authentication request and response flow</title><desc id="diagram-description">The library creates a request identity. Built-in prompts and host-owned login UIs return session results bound to that request; installation rejects stale or canceled responses.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 635.6)">
