[workspace]
resolver = "2"
members = [
    "crates/fairing",
    "crates/fairing-widgets",
    "crates/fairing-fixed-heap",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/shim9610/fairing"

# Declare approved direct dependencies here. Members inherit these version and feature
# requirements with `workspace = true`, adding member-specific optional flags as needed.
#
# egui and eframe use a compatible minor range so an integrator can resolve a shared
# patch version with its other egui dependencies instead of requiring one exact patch. This
# repository's own tree stays exact all the same — Cargo.lock holds the patch, and deps.allow's
# `=X.Y.Z` lines make a patch update an approval diff.
[workspace.dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1" }
log = { version = "0.4" }
# Optional (turned on only through fairing's features)
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "default_fonts", "clipboard"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# **dev only** (approved 2026-09-08). The library does not decode images —
# it is used only by the demos and tests to show a decoder wired into the `ShellBuilder::image_loader`
# hook. Being a dev-dependency, it does not enter an integrator's tree.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Process-wide fixed Rust heap for the unpublished allocation diagnostic.
talc = { version = "=5.1.1", default-features = false, features = ["counters"] }
spinning_top = { version = "=0.3.1", default-features = false }
# Workspace-internal path dependencies. Dropping the version trips cargo-deny's `wildcards = "deny"`,
# so [workspace.package]'s value is repeated here. `cargo xtask integrity` (audit stage 0) compares the
# two so they cannot drift apart. The members use version.workspace = true.
fairing = { path = "crates/fairing", version = "0.1.0", default-features = false }

# The workspace lints, applied to every member.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fairing_loom)", "cfg(fairing_repo_docs)"] }
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# The two product libraries deny these macros outside cfg(test); verification code may assert.
disallowed_macros = "allow"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
indexing_slicing = "warn"
# Clippy rejects the lock types listed in the root clippy.toml's disallowed-types.
# An aliased use, parking_lot and blocking calls on the UI thread are looked at by `xtask sync-check`.
disallowed_types = "deny"
disallowed_methods = "deny"

# No [profile.release] at the root. The integrating root package chooses its release
# profile; a library workspace profile does not propagate into a consuming application.
# The recommended profile for a device binary is written down in crates/fairing/README.md.
