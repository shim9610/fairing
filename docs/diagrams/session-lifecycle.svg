<title id="diagram-title">Fairing session lifecycle</title><desc id="diagram-description">Live publication, busy reads, terminal issuer revocation and local detachment are distinct. An optional authenticator hook lets the issuer revoke the matching controller; its default does nothing. New login creates a new pair.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 638.6)">
<title>session_lifecycle</title>
<polygon fill="white" stroke="transparent" points="-21.6,21.6 -21.6,-638.6 1315.6,-638.6 1315.6,21.6 -21.6,21.6" />
<text text-anchor="middle" x="647" y="-593.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="24.00">Session publication and local detachment</text>

