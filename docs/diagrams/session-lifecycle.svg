<title id="diagram-title">Fairing session lifecycle</title><desc id="diagram-description">Live publication, busy reads, terminal issuer revocation and local detachment are distinct. A matching issuer callback handles other token readers; new login creates a new pair.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 734.6)">
<title>session_lifecycle</title>
<polygon fill="white" stroke="transparent" points="-21.6,21.6 -21.6,-734.6 1099.1,-734.6 1099.1,21.6 -21.6,21.6" />
<text text-anchor="middle" x="538.75" y="-689.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="24.00">Session publication and local detachment</text>

<g id="node1" class="node">
<title>issue</title>
<path fill="#fff9ed" stroke="#6986a8" d="M589,-679C589,-679 207,-679 207,-679 201,-679 195,-673 195,-667 195,-667 195,-635 195,-635 195,-629 201,-623 207,-623 207,-623 589,-623 589,-623 595,-623 601,-629 601,-635 601,-635 601,-667 601,-667 601,-673 595,-679 589,-679" />
<text text-anchor="middle" x="398" y="-656.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">Issuer verifies identity and issues a pair</text>
<text text-anchor="middle" x="398" y="-638.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">Immutable subject, SessionId and gate catalog</text>
</g>

<g id="node2" class="node">
<title>live</title>
<path fill="#f0f6ff" stroke="#6986a8" d="M614,-569C614,-569 182,-569 182,-569 176,-569 170,-563 170,-557 170,-557 170,-507 170,-507 170,-501 176,-495 182,-495 182,-495 614,-495 614,-495 620,-495 626,-501 626,-507 626,-507 626,-557 626,-557 626,-563 620,-569 614,-569" />
<text text-anchor="middle" x="398" y="-546.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">Attached live session</text>
<text text-anchor="middle" x="398" y="-528.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">Fresh snapshot(now) for each admission</text>
<text text-anchor="middle" x="398" y="-510.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">Base and temporary grants evaluated independently</text>
</g>

