<text text-anchor="middle" x="893" y="-386.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">Deny admission; shell drops reader</text>
<text text-anchor="middle" x="893" y="-368.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">No renewal after expiry at issuer's clock</text>
