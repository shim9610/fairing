name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 3 * * 1" }] # every Monday at 03:00 UTC: check for new advisories

# This workflow only reads the repository. GITHUB_TOKEN is given no default permission.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# These jobs are enabled only for shim9610/fairing. The repository conditions below
# skip them in forks and other repositories.
jobs:
  audit:
    if: github.repository == 'shim9610/fairing'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Disable debug info to reduce linked test-binary size and CI disk pressure.
    # Keep the disk reports below to help diagnose failures during linking.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # Pin external actions to immutable commits; comments retain the reviewed major.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Remove unused SDK/toolchain directories to leave more space for compilation.
      # Available space and directory contents depend on the hosted runner image.
      - name: Free the runner's disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Show the disk before the build
        run: df -h /

      - name: Show toolchain (rust-toolchain.toml installs it)
        run: rustup show

      - name: Add components and target
        run: |
          rustup component add clippy rustfmt
          rustup target add aarch64-unknown-linux-gnu

      # The cache path is **the two audit plugin binaries alone**. Caching the whole of ~/.cargo/bin would
      # overwrite the runner's cargo, rustc and rustup proxies on restore.
      - name: Cache audit plugins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: tools-${{ runner.os }}-${{ hashFiles('xtask/tools.lock') }}

      # **`v2` is the debug-info generation.** The key is bumped rather than left alone because a
      # `v1` cache holds a `target` built *with* debug info — restoring it would put the ten
      # gigabytes back before the first line compiles, and the disk would be spent again.
      - name: Cache cargo registry and target dir
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-v2-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-

      # A binary that is already there is not simply trusted. Where the version differs from tools.lock it is installed again.
      - name: Install audit tools from xtask/tools.lock
        run: |
          set -euo pipefail
          while read -r name version; do
            [ -z "${name:-}" ] && continue
            case "$name" in \#*) continue ;; esac
            sub="${name#cargo-}"
            found="$(cargo "$sub" --version 2>/dev/null | head -n1 | awk '{print $NF}' || true)"
            if [ "$found" = "$version" ]; then
              echo "skip $name: $version already installed"
              continue
            fi
            echo "install $name $version (installed: ${found:-none})"
            cargo install "$name" --locked --version "$version" --force
          done < xtask/tools.lock

      # It calls the real binary rather than the alias. `cargo xtask` goes through .cargo/config.toml's
      # [alias], so one line inside the repository could disable the audit itself.
      - name: Audit
        run: cargo run -p xtask --locked -- audit --strict

      # Each feature profile produces its own large test executables. Release workspace
      # artifacts between profiles while keeping shared dependency artifacts cached.
      - name: Check minimal, no-mock and default feature profiles
        run: |
          cargo clean -p fairing -p fairing-widgets
          cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
          cargo test --locked --workspace --no-default-features
          cargo clean -p fairing -p fairing-widgets
          cargo clippy --locked --workspace --all-targets --no-default-features --features fairing/overlay,fairing/osk,fairing/settings,fairing/brand -- -D warnings
          cargo test --locked --workspace --no-default-features --features fairing/overlay,fairing/osk,fairing/settings,fairing/brand
          cargo clean -p fairing -p fairing-widgets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo clean -p fairing -p fairing-widgets

      - name: Inventory public API contracts
        run: |
          python3 tools/test_api_surface.py
          python3 tools/test_api_decisions.py
          python3 tools/api_surface.py
          python3 tools/api_decisions.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-api-inventory
          path: target/api-surface/
          retention-days: 14

      - name: Test release archives and an external consumer
        run: python3 tools/package_check.py

      - name: Keep release-package check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-check
          path: target/package-check/
          retention-days: 14

      # **Always**, so a failed run says whether the disk was the limit. A build that dies in the
      # linker gives no clue on its own, and the answer is one line.
      - name: Show the disk after the build
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true

  # The crates declare a `rust-version`, and everything else here builds with the newer
  # toolchain in rust-toolchain.toml. This job keeps the declaration honest: the two libraries,
  # every feature on, checked with that version itself — read from Cargo.toml, so bumping it is
  # one edit.
  msrv:
    if: github.repository == 'shim9610/fairing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the declared minimum from Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv" || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Install the declared minimum toolchain
        run: rustup toolchain install "$MSRV" --profile minimal

      - name: Check the libraries with it
        run: cargo "+$MSRV" check --locked -p fairing -p fairing-widgets --all-features

  # Example tours check named targets, explicit expectations and capture/write results.
  # They do not assert every photographed state; settle timeouts can warn and continue.
  # Review the saved images for visual/content errors. This run captures stills;
  # tools/readme-gifs.sh separately rebuilds the README animations.
  tours:
    if: github.repository == 'shim9610/fairing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The examples open a real window: winit loads libxkbcommon and libxkbcommon-x11 at run
      # time and glutin a GL through GLX or EGL, none of which the runner image is promised to
      # carry. Missing, the example exits before its first step with nothing but Rust's error.
      - name: Install Xvfb, Mesa's software rasteriser and the libraries winit loads
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libegl1 \
            libegl-mesa0 libgl1-mesa-dri libgbm1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcursor1 libxi6 libxrandr2 libxinerama1

      - name: Cache cargo registry and target dir
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: tours-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            tours-v1-${{ runner.os }}-

      - name: Run every tour
        run: tools/tours.sh

      # The pictures and each tour's log, for a failure to be looked at rather than guessed at.
      - name: Keep the tours' output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tours
          path: target/tours
          retention-days: 7
