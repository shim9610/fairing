<title id="diagram-title">Fairing protected security architecture</title><desc id="diagram-description">The application verifier owns session mutation. Read-only tokens and typed requirements feed the common mediation kernel before managed application payload entry. This is an API boundary within one process.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 1199.87)">
