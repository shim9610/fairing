<text text-anchor="middle" x="271.5" y="-754.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">3. Poll backends and reconcile replies</text>
<text text-anchor="middle" x="271.5" y="-736.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16.00" fill="#17253b">4. Recheck access and poll authentication</text>
</g>

